name: Daily job digest

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 08:00 Riyadh (GitHub may start it a few minutes late)
  workflow_dispatch:       # "Run workflow" button for manual runs

permissions:
  contents: write          # to commit data/sent_jobs.json

concurrency:
  group: job-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run job finder
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python job_finder.py

      - name: Save sent jobs
        run: |
          git config user.name "job-finder-bot"
          git config user.email "job-finder-bot@users.noreply.github.com"
          git add data/sent_jobs.json
          git diff --cached --quiet || git commit -m "Update sent jobs"
          git push
